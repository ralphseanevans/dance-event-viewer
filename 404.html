<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="description" content="This page could not be found on Dance Event Viewer.">
<title>Page not found — Dance Event Viewer</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<!-- Custom GitHub Pages 404 (added 2026-09-27). Self-contained: absolute links only,
     because it is served for any missing path at any depth. -->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #e8f1f2; background: radial-gradient(ellipse at top, #16323a 0%, #0a1216 60%, #06090b 100%);
  }
  main {
    width: 100%; max-width: 520px; text-align: center; padding: 36px 28px;
    background: rgba(14, 26, 31, 0.85); border: 1px solid rgba(58, 208, 200, 0.25);
    border-radius: 18px; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  }
  .mark { display: block; width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 14px; }
  .code { font-size: 14px; letter-spacing: 0.2em; text-transform: uppercase; color: #3ad0c8; margin: 0 0 8px; }
  h1 { font-size: 26px; line-height: 1.25; margin: 0 0 12px; }
  p { color: #b9c9cc; line-height: 1.55; margin: 0 0 22px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  a.btn {
    display: inline-block; padding: 12px 20px; border-radius: 999px; font-weight: 600;
    text-decoration: none; min-height: 44px;
  }
  a.primary { background: #3ad0c8; color: #06221f; }
  a.secondary { border: 1px solid rgba(58, 208, 200, 0.5); color: #bff3ef; }
  a.btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <img class="mark" src="/favicon.ico" width="64" height="64" alt="">
  <p class="code">404 · Page not found</p>
  <h1>We couldn't find that page</h1>
  <p id="msg">The link may be mistyped, or the page may have moved. Every current event is in the viewer.</p>
  <div class="actions">
    <a class="btn primary" href="/dance-event-viewer/">Browse dance events</a>
    <a class="btn secondary" href="/dance-event-viewer/submit-event.html">Submit an event</a>
  </div>
</main>
<script>
  // Event pages (/e/...) that are gone usually mean the event was removed or renamed.
  if (/^\/e\//.test(location.pathname)) {
    document.getElementById("msg").textContent =
      "That event page isn't available — the event may have been removed or renamed. Search the viewer for current events.";
  }
</script>
</body>
</html>
